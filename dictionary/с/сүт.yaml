  etymology: "Common Turkic root 'süt' (milk). Cognate with Turkish 'süt', Uzbek 'sut', Kyrgyz 'süt'."
  history: "A fundamental word in Kazakh nomadic culture. Dairy products (milk, kumiss, ayran, kurt) formed a cornerstone of the traditional diet, making milk one of the most important staples."
  definitions:
    - meaning: "Сүтқоректілердің емшегінен бөлінетін ақ сұйықтық"
      translation_ru: "Молоко"
      translation_en: "Milk"
      examples:
        - kk: "Жылы сүт."
          ru: "Тёплое молоко."
          en: "Warm milk."
        - kk: "Сиыр сүті."
          ru: "Коровье молоко."
          en: "Cow's milk."
